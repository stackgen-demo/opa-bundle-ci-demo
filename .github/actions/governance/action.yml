name: StackGen governance scan
description: Scan Terraform against a workspace OPA governance bundle using the published stackgen360guard Docker image
branding:
  icon: shield
  color: blue

inputs:
  api-url:
    description: StackGen API base URL
    required: true
  workspace-id:
    description: Workspace UUID whose governance policies should be enforced
    required: true
  token:
    description: StackGen API token supplied through a GitHub Actions secret
    required: true
  terraform-path:
    description: Terraform directory relative to the caller checkout
    default: terraform
  output-file:
    description: JSON report path relative to the caller checkout
    default: reports/scan-results.json
  comment-on-pr:
    description: Create or update a governance result comment on the pull request
    default: "true"
  github-token:
    description: GitHub token with pull-requests write permission for result comments
    default: ${{ github.token }}

outputs:
  report-path:
    description: Absolute path of the generated scan report
    value: ${{ steps.scan.outputs.report-path }}
  sarif-path:
    description: Absolute path of the generated SARIF report
    value: ${{ steps.scan.outputs.sarif-path }}
  bundle-revision:
    description: Governance bundle revision used by the scan
    value: ${{ steps.scan.outputs.bundle-revision }}
  violations:
    description: Number of policy violations
    value: ${{ steps.scan.outputs.violations }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        STACKGEN_API_URL: ${{ inputs.api-url }}
        STACKGEN_WORKSPACE_ID: ${{ inputs.workspace-id }}
        STACKGEN_TOKEN: ${{ inputs.token }}
        TERRAFORM_PATH: ${{ inputs.terraform-path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: bash "$GITHUB_ACTION_PATH/scan.sh"
    - name: Comment scan results on the pull request
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        STACKGEN_APP_URL: ${{ format('{0}/app', inputs.api-url) }}
      run: bash "$GITHUB_ACTION_PATH/comment.sh"
    - name: Comment on changed Terraform lines
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python3 "$GITHUB_ACTION_PATH/review.py"
