name: Terraform governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Terraform / governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan Terraform against workspace governance
        env:
          STACKGEN_API_URL: ${{ vars.STACKGEN_API_URL }}
          STACKGEN_WORKSPACE_ID: ${{ vars.STACKGEN_WORKSPACE_ID }}
          STACKGEN_TOKEN: ${{ secrets.STACKGEN_TOKEN }}
        run: python3 scripts/scan.py
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-results-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 7
